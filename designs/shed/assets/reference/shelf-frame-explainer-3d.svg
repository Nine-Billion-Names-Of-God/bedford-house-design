<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">3D shelf frame explainer</title>
  <desc id="desc">Open-frame isometric diagram of a freestanding timber shelf unit showing base frame, uprights, cleats, and plywood shelves.</desc>
  <defs>
    <style>
      .bg { fill: #f6f1e7; }
      .panel { fill: #fffaf2; stroke: #d8ccb8; stroke-width: 2; }
      .title { font: 700 28px 'IBM Plex Sans', Arial, sans-serif; fill: #22352b; }
      .subtitle { font: 600 18px 'IBM Plex Sans', Arial, sans-serif; fill: #335344; }
      .label { font: 500 16px 'IBM Plex Sans', Arial, sans-serif; fill: #294236; }
      .small { font: 500 14px 'IBM Plex Sans', Arial, sans-serif; fill: #4f6256; }
      .timber-top { fill: #bc8350; stroke: #734620; stroke-width: 2; }
      .timber-front { fill: #8d5a31; stroke: #734620; stroke-width: 2; }
      .timber-side { fill: #9f693b; stroke: #734620; stroke-width: 2; }
      .cleat-top { fill: #d6a36b; stroke: #84532c; stroke-width: 2; }
      .cleat-front { fill: #b87e47; stroke: #84532c; stroke-width: 2; }
      .cleat-side { fill: #c38a54; stroke: #84532c; stroke-width: 2; }
      .ply-top { fill: #ead8b3; stroke: #8b6f3f; stroke-width: 2; }
      .ply-front { fill: #b89460; stroke: #8b6f3f; stroke-width: 2; }
      .ply-side { fill: #c9ae7a; stroke: #8b6f3f; stroke-width: 2; }
      .ghost { fill: none; stroke: #99aa9f; stroke-width: 2; stroke-dasharray: 7 7; }
      .arrow { fill: none; stroke: #486154; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#486154"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="980"/>
  <rect class="panel" x="42" y="118" width="1316" height="810" rx="18"/>

  <text class="title" x="64" y="66">3D Shelf Frame Explainer</text>
