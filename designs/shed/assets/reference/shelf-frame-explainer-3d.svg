  <!-- Annotations -->
  <path class="arrow" d="M 1080 242 C 1160 242, 1170 242, 968 252"/>
  <text class="label" x="1084" y="236">light tie-back to wall</text>

  <path class="arrow" d="M 1080 358 C 1180 358, 1180 330, 970 316"/>
  <text class="label" x="1084" y="352">18 mm plywood shelf</text>

  <path class="arrow" d="M 1080 470 C 1180 470, 1180 454, 988 444"/>
  <text class="label" x="1084" y="464">cleat under the shelf</text>

  <path class="arrow" d="M 1066 640 C 1180 640, 1180 694, 952 690"/>
  <text class="label" x="1070" y="634">base frame spreads load</text>

  <path class="arrow" d="M 126 366 C 224 366, 252 360, 294 348"/>
  <text class="label" x="82" y="360">upright</text>

  <path class="arrow" d="M 114 806 C 214 806, 244 780, 276 780"/>
  <text class="label" x="82" y="800">bottom rail / plinth</text>

  <path class="arrow" d="M 112 604 C 212 604, 240 620, 308 640"/>
  <text class="label" x="82" y="598">shelf rests on cleats</text>

  <text class="subtitle" x="78" y="836">Read this as an open frame</text>
  <text class="small" x="78" y="864">The side assemblies are not solid timber walls. They are just rails and uprights with empty space between them.</text>
  <text class="small" x="78" y="890">You only add plywood side panels or backs where you actually want stiffening, a backboard, or a tool panel.</text>
  <text class="small" x="78" y="916">Most of the structure is open so boxes, tools, and tall items can sit within the frame rather than behind a solid side.</text>
</svg>
