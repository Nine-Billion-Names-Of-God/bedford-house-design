<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Shelf frame explainer</title>
  <desc id="desc">Diagram showing a freestanding timber shelf frame with uprights, top and bottom rails, cleats, and plywood shelves in front and side view.</desc>
  <defs>
    <style>
      .bg { fill: #f6f1e7; }
      .panel { fill: #fffaf2; stroke: #d8ccb8; stroke-width: 2; }
      .title { font: 700 28px 'IBM Plex Sans', Arial, sans-serif; fill: #22352b; }
      .subtitle { font: 600 18px 'IBM Plex Sans', Arial, sans-serif; fill: #335344; }
      .label { font: 500 16px 'IBM Plex Sans', Arial, sans-serif; fill: #294236; }
      .small { font: 500 14px 'IBM Plex Sans', Arial, sans-serif; fill: #4f6256; }
      .tiny { font: 500 12px 'IBM Plex Sans', Arial, sans-serif; fill: #5e7065; }
      .timber { fill: #b67b45; stroke: #764722; stroke-width: 2; }
      .cleat { fill: #cf9a61; stroke: #84532c; stroke-width: 2; }
      .ply { fill: #e7d4ad; stroke: #8b6f3f; stroke-width: 2; }
      .ghost { fill: none; stroke: #9db0a4; stroke-width: 2; stroke-dasharray: 7 7; }
      .arrow { fill: none; stroke: #486154; stroke-width: 2; marker-end: url(#arrowhead); }
      .measure { fill: none; stroke: #698374; stroke-width: 1.5; marker-start: url(#arrowheadSmall); marker-end: url(#arrowheadSmall); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#486154"/>
    </marker>
    <marker id="arrowheadSmall" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#698374"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="920"/>

  <text class="title" x="56" y="60">Freestanding Shed Shelf Frame</text>
  <text class="subtitle" x="56" y="92">The frame stands on the floor. The cleats carry the plywood shelves. Wall fixings only stop sway and tipping.</text>

  <rect class="panel" x="42" y="130" width="760" height="620" rx="18"/>
  <rect class="panel" x="838" y="130" width="520" height="620" rx="18"/>
  <rect class="panel" x="42" y="776" width="1316" height="108" rx="18"/>

  <text class="subtitle" x="72" y="170">Front view: one shelf unit with 3 bays</text>
  <text class="subtitle" x="868" y="170">Side view: one bay</text>

  <!-- Front view frame -->
  <rect class="timber" x="120" y="640" width="600" height="28"/>
  <rect class="timber" x="120" y="214" width="600" height="24"/>

  <rect class="timber" x="120" y="214" width="28" height="454"/>
  <rect class="timber" x="316" y="214" width="28" height="454"/>
  <rect class="timber" x="512" y="214" width="28" height="454"/>
  <rect class="timber" x="692" y="214" width="28" height="454"/>

  <!-- Shelf boards in front view -->
  <rect class="ply" x="130" y="546" width="580" height="18"/>
  <rect class="ply" x="130" y="442" width="580" height="18"/>
  <rect class="ply" x="130" y="338" width="580" height="18"/>

  <!-- Shelf heights -->
  <line class="ghost" x1="104" y1="555" x2="735" y2="555"/>
  <line class="ghost" x1="104" y1="451" x2="735" y2="451"/>
  <line class="ghost" x1="104" y1="347" x2="735" y2="347"/>

  <!-- Labels front -->
  <text class="label" x="118" y="698">Bottom rail / base frame sitting on floor</text>
  <text class="label" x="442" y="202">Top rail</text>
  <text class="label" x="86" y="304" transform="rotate(-90 86 304)">Uprights</text>
  <text class="small" x="140" y="535">18 mm plywood shelf board</text>
  <text class="small" x="140" y="431">18 mm plywood shelf board</text>
  <text class="small" x="140" y="327">18 mm plywood shelf board</text>
  <text class="small" x="182" y="252">Bay 1</text>
  <text class="small" x="378" y="252">Bay 2</text>
  <text class="small" x="572" y="252">Bay 3</text>

  <!-- Front view dimensions -->
  <line class="measure" x1="120" y1="185" x2="720" y2="185"/>
  <text class="small" x="360" y="175">overall width</text>
  <line class="measure" x1="120" y1="705" x2="316" y2="705"/>
  <line class="measure" x1="316" y1="705" x2="512" y2="705"/>
  <line class="measure" x1="512" y1="705" x2="720" y2="705"/>
  <text class="tiny" x="186" y="723">bay width</text>
  <text class="tiny" x="382" y="723">bay width</text>
  <text class="tiny" x="590" y="723">bay width</text>

  <!-- Side view frame -->
  <rect class="timber" x="944" y="640" width="250" height="28"/>
  <rect class="timber" x="944" y="214" width="250" height="24"/>
  <rect class="timber" x="944" y="214" width="28" height="454"/>
  <rect class="timber" x="1166" y="214" width="28" height="454"/>

  <!-- Cleats -->
  <rect class="cleat" x="970" y="546" width="196" height="16"/>
  <rect class="cleat" x="970" y="442" width="196" height="16"/>
  <rect class="cleat" x="970" y="338" width="196" height="16"/>

  <!-- Shelf boards side -->
  <rect class="ply" x="958" y="528" width="220" height="18"/>
  <rect class="ply" x="958" y="424" width="220" height="18"/>
  <rect class="ply" x="958" y="320" width="220" height="18"/>

  <!-- Shelf lip -->
  <rect class="timber" x="1166" y="528" width="12" height="18"/>
  <rect class="timber" x="1166" y="424" width="12" height="18"/>
  <rect class="timber" x="1166" y="320" width="12" height="18"/>

  <!-- Wall ghost -->
  <line class="ghost" x1="910" y1="190" x2="910" y2="688"/>
  <text class="tiny" x="870" y="205">shed wall</text>

  <!-- Side labels -->
  <text class="label" x="944" y="698">Base frame on floor</text>
  <text class="small" x="980" y="307">18 mm plywood shelf board</text>
  <text class="small" x="996" y="334">sits on cleats</text>
  <text class="small" x="985" y="365">25 x 50 timber cleat</text>
  <text class="small" x="1198" y="438" transform="rotate(-90 1198 438)">front lip / nosing optional</text>
  <text class="small" x="945" y="760">The shelf board rests on the cleats, then can be screwed down lightly.</text>

  <!-- Arrows -->
  <path class="arrow" d="M 1230 290 C 1280 280, 1282 250, 1190 230"/>
  <text class="small" x="1234" y="286">front upright</text>

  <path class="arrow" d="M 846 506 C 900 506, 908 540, 957 537"/>
  <text class="small" x="842" y="500">plywood shelf board</text>

  <path class="arrow" d="M 1228 372 C 1270 372, 1272 450, 1168 450"/>
  <text class="small" x="1232" y="368">cleat supports shelf</text>

  <path class="arrow" d="M 826 641 C 882 641, 900 654, 944 654"/>
  <text class="small" x="826" y="635">base frame carries load to floor</text>

  <path class="arrow" d="M 830 228 C 876 228, 900 228, 944 228"/>
  <text class="small" x="830" y="220">top tie-back to wall only stops sway</text>

  <!-- Legend -->
  <text class="subtitle" x="74" y="812">What each part does</text>

  <rect class="timber" x="78" y="830" width="28" height="20"/>
  <text class="small" x="120" y="845">Main frame timber: uprights, top rail, bottom rail. This is the structure.</text>

  <rect class="cleat" x="78" y="858" width="28" height="16"/>
  <text class="small" x="120" y="871">Cleat: smaller support strip screwed to the uprights. The shelf sits on it.</text>

  <rect class="ply" x="760" y="830" width="34" height="18"/>
  <text class="small" x="808" y="845">Plywood shelf: the flat deck that boxes and tools sit on.</text>

  <line class="ghost" x1="760" y1="866" x2="794" y2="866"/>
  <text class="small" x="808" y="871">Ghost line: alignment / reference line, not a physical part.</text>

  <text class="tiny" x="74" y="895">Build one timber frame first, then add cleats at each height, then drop the plywood shelves onto those cleats.</text>
</svg>
